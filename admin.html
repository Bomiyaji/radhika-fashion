<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radhika Fashion - Secret Admin Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --fk-blue: #2874f0; --bg-gray: #f1f3f6; --fk-green: #388e3c; --fk-orange: #fb641b; --fk-red: #d32f2f; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg-gray); padding: 20px; color: #212121; }
    .admin-container { max-width: 1000px; margin: 0 auto; }
    .login-box, .panel-box { background: #fff; padding: 20px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .hidden { display: none; }
    .form-control { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .btn { background: var(--fk-blue); color: #fff; border: none; padding: 10px 15px; font-weight: 700; cursor: pointer; border-radius: 4px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: middle; }
    th { background: var(--fk-blue); color: white; }
    .btn-approve { background: #388e3c; color: #fff; border: none; padding: 6px 10px; font-size: 10px; border-radius: 3px; cursor: pointer; font-weight: 600; margin: 2px 0; display: block; width: 100%; text-align: center; }
    .btn-dispatch { background: #2874f0; color: #fff; border: none; padding: 6px 10px; font-size: 10px; border-radius: 3px; cursor: pointer; font-weight: 600; margin: 2px 0; display: block; width: 100%; text-align: center; }
    .btn-out { background: #fb641b; color: #fff; border: none; padding: 6px 10px; font-size: 10px; border-radius: 3px; cursor: pointer; font-weight: 600; margin: 2px 0; display: block; width: 100%; text-align: center; }
    .btn-reset { background: #d32f2f; color: #fff; border: none; padding: 6px 10px; font-size: 10px; border-radius: 3px; cursor: pointer; font-weight: 600; margin: 2px 0; display: block; width: 100%; text-align: center; }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="login-box" id="adminLoginCard">
      <h2><i class="fa-solid fa-lock"></i> Secret Admin Login</h2>
      <input type="password" id="adminPass" class="form-control" placeholder="Enter Password (radhika123)">
      <button class="btn" onclick="checkAdminPassword()">Login to Panel</button>
    </div>

    <div class="panel-box hidden" id="adminPanelCard">
      <h2><i class="fa-solid fa-boxes-stacked"></i> Live Orders Dashboard</h2>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer & Email</th>
              <th>Address</th>
              <th>Item</th>
              <th>Control Actions</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
