<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radhika Fashion - Secret Admin Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --fk-blue: #2874f0; --bg-gray: #f1f3f6; --fk-green: #388e3c; --fk-orange: #fb641b; --fk-red: #d32f2f; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg-gray); padding: 20px; color: #212121; }
    .admin-container { max-width: 1000px; margin: 0 auto; }
    .login-box, .panel-box { background: #fff; padding: 20px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .hidden { display: none; }
    .form-control { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .btn { background: var(--fk-blue); color: #fff; border: none; padding: 10px 15px; font-weight: 700; cursor: pointer; border-radius: 4px; width: 100%; }
    .btn:hover { background: #1d5fc7; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: middle; }
    th { background: var(--fk-blue); color: white; }
    
    .btn-approve { background: #388e3c; color: #fff; border: none; padding: 6px 10px; font-size: 10px; border-radius: 3px; cursor: pointer; font-weight: 600; margin: 2px 0; display: block; width: 100%; text-align: center; }
    .btn-dispatch { background: #2874f0; color: #fff; border: none; padding: 6px 10px; font-size: 10px; border-radius: 3px; cursor: pointer; font-weight: 600; margin: 2px 0; display: block; width: 100%; text-align: center; }
    .btn-out { background: #fb641b; color: #fff; border: none; padding: 6px 10px; font-size: 10px; border-radius: 3px; cursor: pointer; font-weight: 600; margin: 2px 0; display: block; width: 100%; text-align: center; }
    .btn-reset { background: #d32f2f; color: #fff; border: none; padding: 6px 10px; font-size: 10px; border-radius: 3px; cursor: pointer; font-weight: 600; margin: 2px 0; display: block; width: 100%; text-align: center; }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="login-box" id="adminLoginCard">
      <h2><i class="fa-solid fa-lock"></i> Secret Admin Login</h2>
      <input type="password" id="adminPass" class="form-control" placeholder="Enter Admin Secret Password">
      <button class="btn" onclick="checkAdminPassword()">Login to Panel</button>
    </div>

    <div class="panel-box hidden" id="adminPanelCard">
      <h2><i class="fa-solid fa-boxes-stacked"></i> Live Orders Dashboard (Radhika Fashion)</h2>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer & Email</th>
              <th>Delivery Address</th>
              <th>Item & Size</th>
              <th>Status & Control Actions</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6Um_HJ8vyaaSm-JMzdGIDl8pZdw4yZ1U",
      authDomain: "radhika-fashion-ae2db.firebaseapp.com",
      projectId: "radhika-fashion-ae2db",
      storageBucket: "radhika-fashion-ae2db.firebasestorage.app",
      messagingSenderId: "703545319327",
      appId: "1:703545319327:web:b3f77140a2ddfe09c3e7aa",
      measurementId: "G-T2JZXC0MH5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.checkAdminPassword = function() {
      const pass = document.getElementById('adminPass').value;
      if(pass === "radhika123") {
        document.getElementById('adminLoginCard').classList.add('hidden');
        document.getElementById('adminPanelCard').classList.remove('hidden');
        loadOrders();
      } else {
        alert("Wrong Password!");
      }
    }

    async function loadOrders() {
      const tbody = document.getElementById('ordersTableBody');
      tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>Loading live orders...</td></tr>";
      
      try {
        const querySnapshot = await getDocs(collection(db, "orders"));
        tbody.innerHTML = "";
        
        querySnapshot.forEach((documentItem) => {
          const order = documentItem.data();
          const docId = documentItem.id;
          
          tbody.innerHTML += `
            <tr>
              <td><b>#${order.orderId}</b></td>
              <td><b>${order.name}</b><br>${order.phone}<br><span style="color:#666; font-size:11px;">${order.email || 'N/A'}</span></td>
              <td>${order.address}<br><b>${order.location}</b></td>
              <td>${order.item}</td>
              <td>
                <span id="status-${docId}" style="color:var(--fk-green); font-weight:bold;">${order.status || 'Pending Admin Approval'}</span><br><br>
                <button class="btn-approve" onclick="updateOrderStatus('${docId}', 'Approved by Admin', ${order.orderId})">
                  <i class="fa-solid fa-check"></i> 1. Approve Order
                </button>
                <button class="btn-dispatch" onclick="updateOrderStatus('${docId}', 'Dispatched via Express', ${order.orderId})">
                  <i class="fa-solid fa-truck"></i> 2. Mark Dispatched
                </button>
                <button class="btn-out" onclick="updateOrderStatus('${docId}', 'Out for Delivery', ${order.orderId})">
                  <i class="fa-solid fa-box-open"></i> 3. Out for Delivery
                </button>
                <button class="btn-reset" onclick="updateOrderStatus('${docId}', 'Pending Admin Approval', ${order.orderId})">
                  <i class="fa-solid fa-rotate-left"></i> Reset / Revert to Pending
                </button>
              </td>
            </tr>
          `;
        });

        if(querySnapshot.empty) {
          tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>No orders found yet.</td></tr>";
        }
      } catch (e) {
        tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; color:red;'>Error loading data: " + e.message + "</td></tr>";
      }
    }

    window.updateOrderStatus = async function(docId, newStatus, orderIdNum) {
      try {
        const orderRef = doc(db, "orders", docId);
        await updateDoc(orderRef, {
          status: newStatus
        });

        let currentSaved = JSON.parse(localStorage.getItem('radhikaOrder'));
        if(currentSaved && currentSaved.orderId == orderIdNum) {
          currentSaved.status = newStatus;
          localStorage.setItem('radhikaOrder', JSON.stringify(currentSaved));
        }

        alert("Order status successfully updated to: " + newStatus);
        loadOrders();
      } catch (e) {
        alert("Error updating status: " + e.message);
      }
    }
  </script>
</body>
</html>
