<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radhika Fashion - Secret Admin Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --fk-blue: #2874f0; --bg-gray: #f1f3f6; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: var(--bg-gray); padding: 20px; }
    .admin-container { max-width: 800px; margin: 0 auto; }
    .login-box, .panel-box { background: #fff; padding: 20px; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .hidden { display: none; }
    .form-control { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
    .btn { background: var(--fk-blue); color: #fff; border: none; padding: 10px 15px; font-weight: 700; cursor: pointer; border-radius: 4px; width: 100%; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: var(--fk-blue); color: white; }
  </style>
</head>
<body>

  <div class="admin-container">
    <!-- Admin Login -->
    <div class="login-box" id="adminLoginCard">
      <h2><i class="fa-solid fa-lock"></i> Secret Admin Login</h2>
      <input type="password" id="adminPass" class="form-control" placeholder="Enter Admin Secret Password">
      <button class="btn" onclick="checkAdminPassword()">Login</button>
    </div>

    <!-- Admin Orders Dashboard -->
    <div class="panel-box hidden" id="adminPanelCard">
      <h2><i class="fa-solid fa-boxes-stacked"></i> Live Orders Dashboard (Radhika Fashion)</h2>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Name & Phone</th>
              <th>Address</th>
              <th>Item</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody">
            <!-- Orders injected via Firebase -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6Um_HJ8vyaaSm-JMzdGIDl8pZdw4yZ1U",
      authDomain: "radhika-fashion-ae2db.firebaseapp.com",
      projectId: "radhika-fashion-ae2db",
      storageBucket: "radhika-fashion-ae2db.firebasestorage.app",
      messagingSenderId: "703545319327",
      appId: "1:703545319327:web:b3f77140a2ddfe09c3e7aa",
      measurementId: "G-T2JZXC0MH5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.checkAdminPassword = function() {
      const pass = document.getElementById('adminPass').value;
      if(pass === "radhika123") { // Yahan tu apna manchaha password rakh sakta hai
        document.getElementById('adminLoginCard').classList.add('hidden');
        document.getElementById('adminPanelCard').classList.remove('hidden');
        loadOrders();
      } else {
        alert("Wrong Password!");
      }
    }

    async function loadOrders() {
      const tbody = document.getElementById('ordersTableBody');
      tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>Loading orders...</td></tr>";
      
      try {
        const querySnapshot = await getDocs(collection(db, "orders"));
        tbody.innerHTML = "";
        querySnapshot.forEach((doc) => {
          const order = doc.data();
          tbody.innerHTML += `
            <tr>
              <td>#${order.orderId}</td>
              <td><b>${order.name}</b><br>${order.phone}</td>
              <td>${order.address}<br>${order.location}</td>
              <td>${order.item}</td>
              <td><span style="color:green; font-weight:bold;">Approved by Admin</span></td>
            </tr>
          `;
        });
        if(querySnapshot.empty) {
          tbody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>No orders found yet.</td></tr>";
        }
      } catch (e) {
        tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; color:red;'>Error loading data: " + e.message + "</td></tr>";
      }
    }
  </script>
</body>
</html>
