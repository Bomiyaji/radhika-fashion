<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radhika Fashion Collection - Order Now</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --fk-blue: #2874f0; --fk-yellow: #ffe500; --fk-red: #d32f2f; --bg-gray: #f1f3f6; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-gray); color: #212121; padding-bottom: 40px; }
    .header { background-color: var(--fk-blue); color: white; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(40,116,240,0.3); }
    .brand-logo { font-size: 18px; font-weight: 800; font-style: italic; }
    .brand-logo span { color: var(--fk-yellow); font-style: normal; font-size: 12px; }
    .container { max-width: 500px; margin: 15px auto; padding: 0 10px; }
    .card { background: #fff; border-radius: 6px; padding: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #e0e0e0; margin-bottom: 15px; }
    .warning-banner { background: #ffebee; color: var(--fk-red); padding: 10px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-bottom: 15px; border: 1px solid #ffcdd2; display: flex; gap: 8px; align-items: center; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: #333; }
    .form-control { width: 100%; padding: 11px; border: 1px solid #dcdcdc; border-radius: 4px; font-size: 13px; }
    .btn-submit { background: var(--fk-yellow); color: #212121; border: none; width: 100%; padding: 13px; font-weight: 800; font-size: 14px; border-radius: 4px; cursor: pointer; text-transform: uppercase; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    .btn-submit:hover { background: #ffd700; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand-logo">Radhika Fashion Collection <span>Exclusive Store</span></div>
  </div>

  <div class="container">
    <div class="card">
      <div class="warning-banner">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 16px;"></i>
        <span><strong>COD Notice:</strong> Cash on Delivery is strictly restricted for Non-Delhi regions without Admin Approval.</span>
      </div>

      <h2 style="font-size: 16px; margin-bottom: 15px; color: #212121;"><i class="fa-solid fa-bag-shopping"></i> Place Your Order</h2>

      <form id="orderForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="custName" class="form-control" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="custPhone" class="form-control" placeholder="10-digit mobile number" required>
        </div>

        <div class="form-group">
          <label>Email ID (For History / Login)</label>
          <input type="email" id="custEmail" class="form-control" placeholder="Enter your email address" required>
        </div>

        <div class="form-group">
          <label>Select Item & Design</label>
          <select id="custItem" class="form-control">
            <option value="Bottle Green | Size: XL">Bottle Green Designer Suit (Size: XL)</option>
            <option value="Maroon Suit | Size: M">Maroon Velvet Suit (Size: M)</option>
            <option value="Royal Blue | Size: L">Royal Blue Party Wear Kurti (Size: L)</option>
            <option value="Classic Black Design | Size: 5XL">Classic Black Heavy Embroidery (Size: 5XL)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Select Region / Location</label>
          <select id="custLocation" class="form-control" onchange="checkLocation()">
            <option value="Delhi">Delhi (COD Available instantly)</option>
            <option value="Rajasthan">Rajasthan (COD Restricted - Admin Approval Required)</option>
            <option value="Haryana">Haryana (COD Restricted - Admin Approval Required)</option>
            <option value="Uttar Pradesh">Uttar Pradesh (COD Restricted)</option>
            <option value="Other State">Other State (COD Restricted)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Delivery Address with Pincode</label>
          <textarea id="custAddress" class="form-control" rows="3" placeholder="House No, Street, Landmark, Pincode" required></textarea>
        </div>

        <button type="submit" class="btn-submit">Confirm & Track Order</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6Um_HJ8vyaaSm-JMzdGIDl8pZdw4yZ1U",
      authDomain: "radhika-fashion-ae2db.firebaseapp.com",
      projectId: "radhika-fashion-ae2db",
      storageBucket: "radhika-fashion-ae2db.firebasestorage.app",
      messagingSenderId: "703545319327",
      appId: "1:703545319327:web:b3f77140a2ddfe09c3e7aa",
      measurementId: "G-T2JZXC0MH5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('orderForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const orderIdNum = Math.floor(100000 + Math.random() * 900000);
      const orderData = {
        orderId: orderIdNum,
        name: document.getElementById('custName').value,
        phone: document.getElementById('custPhone').value,
        email: document.getElementById('custEmail').value,
        item: document.getElementById('custItem').value,
        location: document.getElementById('custLocation').value,
        address: document.getElementById('custAddress').value,
        status: "Pending Admin Approval",
        createdAt: new Date().toISOString()
      };

      try {
        await addDoc(collection(db, "orders"), orderData);
        localStorage.setItem('radhikaOrder', JSON.stringify(orderData));
        window.location.href = "tracking.html";
      } catch (err) {
        alert("Error saving order: " + err.message);
      }
    });
  </script>
</body>
</html>
