<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radhika Fashion - Order Form</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --fk-blue: #2874f0; --fk-yellow: #ffe500; --fk-red: #d32f2f; --bg-gray: #f1f3f6; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg-gray); padding-bottom: 40px; color: #212121; }
    .header { background-color: var(--fk-blue); color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .container { max-width: 500px; margin: 15px auto; padding: 0 10px; }
    .card { background: #fff; border-radius: 6px; padding: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .warning-banner { background: #ffebee; color: var(--fk-red); padding: 10px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-bottom: 15px; border: 1px solid #ffcdd2; display: flex; gap: 8px; align-items: center; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: #333; }
    .form-control { width: 100%; padding: 11px; border: 1px solid #dcdcdc; border-radius: 4px; font-size: 13px; }
    .btn-submit { background: var(--fk-yellow); color: #212121; border: none; width: 100%; padding: 13px; font-weight: 800; font-size: 14px; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="header">
    <div style="font-weight: 800; font-style: italic;">Radhika Fashion Collection</div>
    <button onclick="logoutUser()" style="background:none; border:none; color:#fff; cursor:pointer; font-size:12px;"><i class="fa-solid fa-right-from-bracket"></i> Log out</button>
  </div>

  <div class="container">
    <div class="card">
      <div class="warning-banner">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span><strong>COD Notice:</strong> Cash on Delivery restricted for Non-Delhi regions without Admin approval.</span>
      </div>

      <h2 style="font-size: 16px; margin-bottom: 15px;"><i class="fa-solid fa-bag-shopping"></i> Delivery & Address Form</h2>

      <form onsubmit="submitOrder(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="custName" class="form-control" placeholder="Enter full name" required>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="custPhone" class="form-control" placeholder="10-digit mobile number" required>
        </div>
        <div class="form-group">
          <label>Select Item & Size</label>
          <select id="custItem" class="form-control">
            <option value="Bottle Green | Size: XL">Bottle Green Designer Suit (Size: XL)</option>
            <option value="Maroon Suit | Size: M">Maroon Velvet Suit (Size: M)</option>
            <option value="Royal Blue | Size: L">Royal Blue Party Wear Kurti (Size: L)</option>
            <option value="Classic Black Design | Size: 5XL">Classic Black Heavy Embroidery (Size: 5XL)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Select Region / Location</label>
          <select id="custLocation" class="form-control">
            <option value="Delhi">Delhi (Instant COD)</option>
            <option value="Rajasthan">Rajasthan (COD Restricted - Approval Needed)</option>
            <option value="Haryana">Haryana (COD Restricted - Approval Needed)</option>
            <option value="Uttar Pradesh">Uttar Pradesh (COD Restricted)</option>
            <option value="Other State">Other State (COD Restricted)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Delivery Address with Pincode</label>
          <textarea id="custAddress" class="form-control" rows="3" placeholder="House No, Street, Landmark, Pincode" required></textarea>
        </div>
        <button type="submit" class="btn-submit">Confirm Order & Track</button>
      </form>
    </div>
  </div>
  <script type="module" src="app.js"></script>
  <script>
    window.onload = function() { checkSession(true); };
  </script>
</body>
</html>
